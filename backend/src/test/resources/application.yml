# Test profile: in-memory H2 so `mvn test` never requires a live MySQL instance.
# Flyway is disabled for tests - Hibernate creates the schema directly from the
# entities (create-drop) so repository/service tests stay fast and isolated.
spring:
  datasource:
    url: jdbc:h2:mem:smartbatch360_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
