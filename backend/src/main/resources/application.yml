server:
  # 8080 is avoided as a default since it commonly collides with other local dev
  # servers (e.g. Keycloak). Override with SERVER_PORT if 8081 is also taken.
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: smartbatch360-api

  # MySQL connection is fully externalized. Nothing here is a real credential -
  # these are local-dev defaults only, overridden by environment variables.
  datasource:
    # connectionTimeZone + forceConnectionTimeZoneToSession makes the session UTC.
    # serverTimezone=UTC used to be here, but it only tells the driver what to
    # assume - the session stayed on SYSTEM, so an Instant of 10:00Z was written
    # as 10:00 local and stored as 04:30Z. Reads shifted it back, so the app was
    # self-consistent and the desktop showed the right local time, but the stored
    # instants were 5:30 out and anything else reading this database - a report, an
    # export, a future integration - saw times that never happened.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartbatch360}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:smartbatch360}
    password: ${DB_PASSWORD:smartbatch360}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Schema is owned by Flyway migrations, never by Hibernate auto-generation.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

smartbatch360:
  plant:
    # How much the mixer holds, in cubic metres (the plant's range is 0.1 to 10).
    # Production is planned in m3 so an operator can see the size of a load and
    # match it to a vehicle, whose capacity is already recorded in m3. A load
    # larger than the mixer runs as repeated cycles of this size.
    #
    # Empty means production planning has nothing to divide by and will say so.
    mixer-capacity-m3: ${MIXER_CAPACITY_M3:}

  recipe:
    # The largest total, in kilograms, that one recipe may add up to - the
    # plant's batch capacity. A recipe's total is the sum of its material lines,
    # so without this a mix can be saved that the mixer cannot physically hold.
    #
    # Empty means no limit, which is how recipes behaved before this existed.
    # The number belongs to the plant, so it is not guessed here: set it when
    # the capacity is known.
    max-total-kg: ${RECIPE_MAX_TOTAL_KG:}

  reporting:
    # The zone the plant's days are measured in. Cycle times are stored as true
    # UTC instants, but a date on a report means a day at the plant - so a batch
    # made at 01:30 on a night shift belongs to that day, not the previous one.
    # Empty means the zone the server runs in, which for a single-plant install
    # is the plant's own. Set it when the server is somewhere else.
    zone: ${REPORTING_ZONE:}

logging:
  level:
    com.smartbatch360: INFO
