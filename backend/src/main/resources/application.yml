server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smartbatch360-api

  # MySQL connection is fully externalized. Nothing here is a real credential -
  # these are local-dev defaults only, overridden by environment variables.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartbatch360}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:smartbatch360}
    password: ${DB_PASSWORD:smartbatch360}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Schema is owned by Flyway migrations, never by Hibernate auto-generation.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.smartbatch360: INFO
